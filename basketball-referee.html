<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101923"><title>농구 슛 챌린지</title><style>
*{box-sizing:border-box}body{margin:0;background:#101923;color:white;font-family:system-ui,sans-serif}main{max-width:520px;margin:auto;padding:24px 20px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}h1{font-size:20px;margin:0}header span,.label{color:#a7b5c5;font-size:14px}.timer{text-align:center;padding:22px 0;background:#1b2836;border:1px solid #334353;border-radius:24px}.time{font-size:clamp(64px,18vw,88px);font-weight:750;font-variant-numeric:tabular-nums;line-height:1.3}#status{color:#ffc45c;min-height:24px}progress{width:80%;height:6px;accent-color:#ff963c}button{font:inherit;border:0;border-radius:16px;cursor:pointer;touch-action:manipulation;font-weight:700;min-height:56px}button:disabled{opacity:.4}#hit{width:100%;background:#ff963c;color:#161d25;margin-top:18px;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 0 #b75b17}#hit:active:enabled{transform:translateY(3px);box-shadow:0 3px 0 #b75b17}#score{font-size:88px;line-height:1.15;font-variant-numeric:tabular-nums}#hit span:last-child{font-size:21px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}#start{background:#e9f1f8;color:#15212e}#minus,#reset{background:#233344;color:#e9f1f8;border:1px solid #405164}#reset{width:100%;margin-top:12px}footer{color:#a7b5c5;font-size:14px;line-height:1.6;margin-top:22px;text-align:center}.done .time{color:#ff963c}.done .timer{border-color:#ff963c}button:focus-visible{outline:3px solid white;outline-offset:4px}
</style></head><body><main><header><h1>농구 슛 챌린지</h1><span>심판용 · 300초</span></header><section class="timer" aria-label="남은 시간"><div class="label">남은 시간</div><div id="time" class="time">05:00</div><div id="status" role="status">시작할 준비가 되었어요</div><progress id="progress" max="300" value="300" aria-label="남은 시간 비율"></progress></section><button id="hit" disabled aria-label="슛 성공 1회 추가"><span style="font-size:14px">성공한 슛</span><strong id="score">0</strong><span>슛 성공 +1</span></button><div class="actions"><button id="start">시작</button><button id="minus" disabled>잘못 눌렀어요 −1</button></div><button id="reset">다음 팀 · 초기화</button><footer>시작 후 성공할 때마다 큰 버튼을 누르세요.<br>종료 알람을 위해 소리를 켜고 이 화면을 유지하세요.</footer></main><script>
let count=0,state='ready',deadline=0,remaining=300000,interval=null,ctx=null,wake=null;
const el=id=>document.getElementById(id);
function render(){const sec=Math.ceil(remaining/1000);el('time').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');el('progress').value=remaining/1000;el('score').textContent=count;el('hit').disabled=state!=='running';el('minus').disabled=count===0;el('start').disabled=state==='done';el('start').textContent=state==='running'?'일시정지':state==='paused'?'계속하기':'시작';el('status').textContent=state==='running'?'경기 진행 중':state==='paused'?'일시정지':state==='done'?'경기 종료 · '+count+'회 성공':'시작할 준비가 되었어요';document.body.classList.toggle('done',state==='done');}
async function keepAwake(){try{wake=await navigator.wakeLock?.request('screen')}catch{}}
function release(){wake?.release().catch(()=>{});wake=null;}
function alarm(){if(ctx){const t=ctx.currentTime;for(let i=0;i<6;i++){const o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.value=i%2?660:880;g.gain.setValueAtTime(0,t+i*.5);g.gain.linearRampToValueAtTime(.18,t+i*.5+.02);g.gain.setValueAtTime(.18,t+i*.5+.3);g.gain.linearRampToValueAtTime(0,t+i*.5+.36);o.connect(g);g.connect(ctx.destination);o.start(t+i*.5);o.stop(t+i*.5+.4);}}navigator.vibrate?.([400,150,400,150,800]);}
function tick(){if(state!=='running')return;remaining=Math.max(0,deadline-Date.now());if(!remaining){state='done';clearInterval(interval);release();alarm();}render();}
el('start').onclick=()=>{if(state==='running'){tick();if(state==='done')return;state='paused';clearInterval(interval);release();render();return;}try{ctx??=new(window.AudioContext||window.webkitAudioContext)();ctx.resume().catch(()=>{});}catch{}state='running';deadline=Date.now()+remaining;interval=setInterval(tick,100);keepAwake();render();};
el('hit').onclick=()=>{tick();if(state==='running'){count++;render();}};
el('minus').onclick=()=>{if(count>0){count--;render();}};
el('reset').onclick=()=>{if(state==='running'&&!confirm('진행 중인 경기를 초기화하고 다음 팀을 준비할까요?'))return;clearInterval(interval);release();state='ready';remaining=300000;count=0;render();};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&state==='running'){tick();if(state==='running')keepAwake();}});render();
</script></body></html>
